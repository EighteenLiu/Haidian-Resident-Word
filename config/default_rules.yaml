filters:
  point_level_1: "北部地区"
  deduct_case: "是"
  case_status: "结案"
  solved_required: "是"
  require_report_time_year: false
  filter_report_time_range: false
  require_deadline_in_report_month: true
  require_indicator_mapped: true
  require_village_in_dict: true
  excluded_case_ids:
